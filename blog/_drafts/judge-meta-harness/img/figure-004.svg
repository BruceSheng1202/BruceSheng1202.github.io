<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470" role="img" aria-label="One round of the meta-harness search" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="760" height="470" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" fill="#172033" text-anchor="start" font-weight="650">One round of the meta-harness search</text><text x="24.0" y="56.0" font-size="12" fill="#667085" text-anchor="start" font-weight="400">A candidate becomes the new reference only after passing two paired gates.</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c9c4bb"/></marker></defs><path d="M242.0 140H272.0" fill="none" stroke="#c9c4bb" stroke-width="1.4" marker-end="url(#arr)"/><path d="M486.0 140H516.0" fill="none" stroke="#c9c4bb" stroke-width="1.4" marker-end="url(#arr)"/><path d="M624 177.0V257.0" fill="none" stroke="#c9c4bb" stroke-width="1.4" marker-end="url(#arr)"/><path d="M518.0 296H488.0" fill="none" stroke="#c9c4bb" stroke-width="1.4" marker-end="url(#arr)"/><path d="M274.0 296H244.0" fill="none" stroke="#c9c4bb" stroke-width="1.4" marker-end="url(#arr)"/><path d="M136 259.0V179.0" fill="none" stroke="#c9c4bb" stroke-width="1.4" marker-end="url(#arr)"/><path d="M136 333.0V388" fill="none" stroke="#c9c4bb" stroke-width="1.4" marker-end="url(#arr)"/><rect x="30.0" y="103.0" width="212" height="74" rx="9" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.2"/><text x="136.0" y="128.0" font-size="13.5" fill="#172033" text-anchor="middle" font-weight="650">Proposer</text><text x="136.0" y="148.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">reads past code and per-row traces</text><text x="136.0" y="165.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">writes 4 candidates per round</text><rect x="274.0" y="103.0" width="212" height="74" rx="9" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.2"/><text x="380.0" y="128.0" font-size="13.5" fill="#172033" text-anchor="middle" font-weight="650">Static checks</text><text x="380.0" y="148.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">import allowlist, leak scan</text><text x="380.0" y="165.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">mock contract tests, ≤ 2 repairs</text><rect x="518.0" y="103.0" width="212" height="74" rx="9" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.2"/><text x="624.0" y="128.0" font-size="13.5" fill="#172033" text-anchor="middle" font-weight="650">Train-set eval</text><text x="624.0" y="148.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">2,000 rows, traces sent back</text><text x="624.0" y="165.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">score does not decide</text><rect x="518.0" y="259.0" width="212" height="74" rx="9" fill="#eef3ff" stroke="#4169e1" stroke-width="1.8"/><text x="624.0" y="284.0" font-size="13.5" fill="#00205b" text-anchor="middle" font-weight="650">Dev gate</text><text x="624.0" y="304.0" font-size="11.5" fill="#172033" text-anchor="middle" font-weight="400">1,000 rotating rows, paired</text><text x="624.0" y="321.0" font-size="11.5" fill="#172033" text-anchor="middle" font-weight="400">ΔMF1 ≥ +0.3, F1⁻ not lower</text><rect x="274.0" y="259.0" width="212" height="74" rx="9" fill="#eef3ff" stroke="#4169e1" stroke-width="1.8"/><text x="380.0" y="284.0" font-size="13.5" fill="#00205b" text-anchor="middle" font-weight="650">Validation gate</text><text x="380.0" y="304.0" font-size="11.5" fill="#172033" text-anchor="middle" font-weight="400">all 7,404 rows, paired</text><text x="380.0" y="321.0" font-size="11.5" fill="#172033" text-anchor="middle" font-weight="400">95% CI lower bound &gt; 0, F1⁻ not lower</text><rect x="30.0" y="259.0" width="212" height="74" rx="9" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.2"/><text x="136.0" y="284.0" font-size="13.5" fill="#172033" text-anchor="middle" font-weight="650">New reference</text><text x="136.0" y="304.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">accepted only if both gates pass</text><text x="136.0" y="321.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">next round starts here</text><text x="614.0" y="222.0" font-size="11.5" fill="#667085" text-anchor="end" font-weight="400">timing and failure-rate check</text><text x="502.0" y="286.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">pass</text><text x="258.0" y="286.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">pass</text><text x="148.0" y="222.0" font-size="11.5" fill="#667085" text-anchor="start" font-weight="400">next round</text><text x="148.0" y="366.0" font-size="11.5" fill="#667085" text-anchor="start" font-weight="400">at the deadline</text><text x="736.0" y="366.0" font-size="11.5" fill="#667085" text-anchor="end" font-weight="400">fail either gate: rejected, logged to history</text><rect x="24" y="390" width="712" height="58" rx="9" fill="#f7f6f3" stroke="#c9c4bb" stroke-width="1.2"/><text x="380.0" y="413.0" font-size="13.5" fill="#172033" text-anchor="middle" font-weight="650">Final test, run once</text><text x="380.0" y="432.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">best 2 accepted candidates + 3 seeds on the 14,728 test rows; paired CIs against the seed reference</text></svg>
