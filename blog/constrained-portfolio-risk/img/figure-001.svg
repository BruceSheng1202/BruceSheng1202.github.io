<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-label="Long-only weights for three stocks form a triangle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="640" height="470" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" fill="#172033" text-anchor="start" font-weight="650">Long-only weights for three stocks form a triangle</text><text x="24.0" y="56.0" font-size="12" fill="#667085" text-anchor="start" font-weight="400">The optimizer lands on one face of it. Free directions on that face: d = holdings − 1.</text><polygon points="320,110 520,420 120,420" fill="#eef3ff" stroke="#c9c4bb" stroke-width="1.4"/><line x1="320" y1="110" x2="520" y2="420" stroke="#4169e1" stroke-width="4" stroke-linecap="round"/><circle cx="320" cy="110" r="5" fill="#00205b"/><circle cx="520" cy="420" r="5" fill="#00205b"/><circle cx="120" cy="420" r="5" fill="#00205b"/><text x="320.0" y="98.0" font-size="14" fill="#00205b" text-anchor="middle" font-weight="650">A</text><text x="532.0" y="425.0" font-size="14" fill="#00205b" text-anchor="start" font-weight="650">B</text><text x="108.0" y="425.0" font-size="14" fill="#00205b" text-anchor="end" font-weight="650">C</text><circle cx="430.0" cy="280.5" r="7.5" fill="#4169e1" stroke="#ffffff" stroke-width="2"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4169e1"/></marker></defs><line x1="389.9" y1="251.6" x2="439.8" y2="328.9" stroke="#4169e1" stroke-width="1.6" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="470.0" y="278.5" font-size="12.5" fill="#172033" text-anchor="start" font-weight="650">optimizer lands here</text><text x="470.0" y="296.5" font-size="12" fill="#667085" text-anchor="start" font-weight="400">free to slide: 1 direction</text><text x="470.0" y="313.5" font-size="12" fill="#667085" text-anchor="start" font-weight="400">weight of C pinned at 0</text><text x="320.0" y="345.0" font-size="12.5" fill="#172033" text-anchor="middle" font-weight="400">the inside: all three held, d = 2</text><text x="320.0" y="446.0" font-size="12.5" fill="#172033" text-anchor="middle" font-weight="400">an edge: two held, d = 1</text><text x="98.0" y="110.0" font-size="12.5" fill="#172033" text-anchor="start" font-weight="400">a corner: one stock held, d = 0</text><path d="M150 116L310 112" stroke="#c9c4bb" stroke-width="1.2" fill="none"/></svg>
