<svg xmlns="http://www.w3.org/2000/svg" width="760" height="406" viewBox="0 0 760 406" role="img" aria-label="Reading better gets to 69; calibrating on labels adds 2–3 more" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="760" height="406" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" fill="#172033" text-anchor="start" font-weight="650">Reading better gets to 69; calibrating on labels adds 2–3 more</text><text x="24.0" y="56.0" font-size="12" fill="#667085" text-anchor="start" font-weight="400">MF1 on the same test rows, recomputed from r07b's per-row logs with no new inference.</text><text x="24.0" y="74.0" font-size="12" fill="#667085" text-anchor="start" font-weight="400">Blue = calibrated on the 2,000 training labels. Hollow = no LLM call at all.</text><line x1="361.8" x2="361.8" y1="106" y2="354" stroke="#ece9e3"/><text x="361.8" y="372.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">60</text><line x1="449.3" x2="449.3" y1="106" y2="354" stroke="#ece9e3"/><text x="449.3" y="372.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">64</text><line x1="536.9" x2="536.9" y1="106" y2="354" stroke="#ece9e3"/><text x="536.9" y="372.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">68</text><line x1="624.4" x2="624.4" y1="106" y2="354" stroke="#ece9e3"/><text x="624.4" y="372.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">72</text><line x1="712.0" x2="712.0" y1="106" y2="354" stroke="#ece9e3"/><text x="712.0" y="372.0" font-size="11.5" fill="#667085" text-anchor="middle" font-weight="400">76</text><text x="712.0" y="392.0" font-size="11.5" fill="#667085" text-anchor="end" font-weight="400">MF1 (%)</text><line x1="561.8" x2="561.8" y1="106" y2="354" stroke="#8a93a6" stroke-dasharray="4 4"/><text x="567.8" y="100.0" font-size="11.5" fill="#667085" text-anchor="start" font-weight="400">best bare judge 69.14</text><text x="300.0" y="126.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="650">Full r07b: two views + calibration + prior</text><circle cx="637.1" cy="122" r="6.5" fill="#4169e1"/><text x="649.1" y="126.0" font-size="11.5" fill="#172033" text-anchor="start" font-weight="600">72.58</text><text x="300.0" y="153.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="650">Compact-contrast view + calibration</text><circle cx="636.0" cy="149" r="6.5" fill="#4169e1"/><text x="648.0" y="153.0" font-size="11.5" fill="#172033" text-anchor="start" font-weight="600">72.53</text><text x="300.0" y="180.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="650">Two views + calibration, no lexical prior</text><circle cx="628.6" cy="176" r="6.5" fill="#4169e1"/><text x="640.6" y="180.0" font-size="11.5" fill="#172033" text-anchor="start" font-weight="600">72.19</text><text x="300.0" y="207.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="650">Grading-notes view + calibration</text><circle cx="622.7" cy="203" r="6.5" fill="#4169e1"/><text x="634.7" y="207.0" font-size="11.5" fill="#172033" text-anchor="start" font-weight="600">71.92</text><text x="300.0" y="234.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="400">Compact-contrast view, own verdict</text><circle cx="586.6" cy="230" r="6.5" fill="#bdb7ad"/><text x="598.6" y="234.0" font-size="11.5" fill="#667085" text-anchor="start" font-weight="400">70.27</text><text x="300.0" y="261.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="400">Grading-notes view, own verdict</text><circle cx="559.7" cy="257" r="6.5" fill="#bdb7ad"/><text x="547.7" y="261.0" font-size="11.5" fill="#667085" text-anchor="end" font-weight="400">69.04</text><text x="300.0" y="288.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="400">Lexical classifier only (no LLM)</text><circle cx="506.2" cy="284" r="5.6" fill="#ffffff" stroke="#667085" stroke-width="2"/><text x="494.2" y="288.0" font-size="11.5" fill="#667085" text-anchor="end" font-weight="400">66.60</text><text x="300.0" y="315.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="400">Constant verdict per rubric (no LLM)</text><circle cx="430.5" cy="311" r="5.6" fill="#ffffff" stroke="#667085" stroke-width="2"/><text x="418.5" y="315.0" font-size="11.5" fill="#667085" text-anchor="end" font-weight="400">63.14</text><text x="300.0" y="342.0" font-size="12.5" fill="#172033" text-anchor="end" font-weight="400">Bare judge (official prompt)</text><circle cx="386.1" cy="338" r="6.5" fill="#bdb7ad"/><text x="374.1" y="342.0" font-size="11.5" fill="#667085" text-anchor="end" font-weight="400">61.11</text></svg>
