<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-label="Diagram of the looped decision model" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect width="640" height="600" fill="#ffffff"/><text x="24.0" y="34.0" font-size="16" fill="#172033" text-anchor="start" font-weight="650">Looping the middle 8 layers</text><text x="24.0" y="56.0" font-size="12" fill="#667085" text-anchor="start" font-weight="400">Every pass is read out, so the model can stop after any pass.</text><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a93a6"/></marker></defs><rect x="80.0" y="92" width="260" height="46" rx="10" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.3"/><text x="210.0" y="120.0" font-size="15" fill="#172033" text-anchor="middle" font-weight="600">Question + options</text><rect x="80.0" y="172" width="260" height="62" rx="10" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.3"/><text x="210.0" y="199.0" font-size="16" fill="#172033" text-anchor="middle" font-weight="650">Layers 0–11</text><text x="210.0" y="220.0" font-size="13.5" fill="#667085" text-anchor="middle" font-weight="400">run once</text><rect x="80.0" y="268" width="260" height="70" rx="10" fill="#eef3ff" stroke="#4169e1" stroke-width="2.0"/><text x="210.0" y="299.0" font-size="16" fill="#00205b" text-anchor="middle" font-weight="650">Layers 12–19</text><text x="210.0" y="320.0" font-size="13.5" fill="#667085" text-anchor="middle" font-weight="400">run again on every pass</text><rect x="80.0" y="372" width="260" height="62" rx="10" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.3"/><text x="210.0" y="399.0" font-size="16" fill="#172033" text-anchor="middle" font-weight="650">Layers 20–31 + readout</text><text x="210.0" y="420.0" font-size="13.5" fill="#667085" text-anchor="middle" font-weight="400">run after every pass</text><rect x="80.0" y="468" width="260" height="46" rx="10" fill="#ffffff" stroke="#c9c4bb" stroke-width="1.3"/><text x="210.0" y="496.0" font-size="15" fill="#172033" text-anchor="middle" font-weight="600">Answer distribution at pass t</text><path d="M210 140V168" fill="none" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/><path d="M210 236V264" fill="none" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/><path d="M210 340V368" fill="none" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/><path d="M210 436V464" fill="none" stroke="#8a93a6" stroke-width="1.5" marker-end="url(#arr)"/><path d="M342.0 322 C410.0 334, 410.0 272, 346.0 284" fill="none" stroke="#4169e1" stroke-width="2" marker-end="url(#arr)"/><text x="414.0" y="286.0" font-size="14" fill="#00205b" text-anchor="start" font-weight="650">next pass =</text><text x="414.0" y="305.0" font-size="14" fill="#00205b" text-anchor="start" font-weight="650">previous output</text><text x="414.0" y="324.0" font-size="13" fill="#667085" text-anchor="start" font-weight="400">+ small learned correction</text><text x="24.0" y="576.0" font-size="13" fill="#667085" text-anchor="start" font-weight="400">Only LoRA and the readout are trained. Training uses 4 passes.</text></svg>
